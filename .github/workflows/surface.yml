name: surface

# Surface checks (#617): size budgets, filenames, archive placement and the
# status log. The fixture run must pass, and each subcommand runs in strict
# mode as its own step, so a finding fails the job and names its check. The
# ADR Enforcement rule (#661) runs in warn mode: it prints its findings and
# passes until the ADRs are clean through #702, then flips to --strict.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Fixture tests
        run: tests/surface/run.sh
      - name: Size budgets
        run: bin/check-surface.sh --strict size
      - name: Filenames
        run: bin/check-surface.sh --strict filenames
      - name: Archive placement
        run: bin/check-surface.sh --strict placement
      - name: Status log
        run: bin/check-surface.sh --strict statuslog
      - name: ADR enforcement (warn mode)
        run: bin/check-surface.sh enforcement
