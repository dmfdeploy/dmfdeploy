name: governance-drift

# Asserts the live branch ruleset against .github/expected-ruleset.json.
#
# The ruleset is what makes every other gate binding — required checks,
# code-owner review, linear history. Nothing asserted it, so a dropped required
# check or code-owner review turned off would go unnoticed (umbrella #368).
# Anti-degradation belongs in a deterministic assertion rather than in a role:
# a check cannot forget.
#
# TOKEN-FREE, DELIBERATELY. Do NOT add a PAT to make this cover more.
# An earlier revision took an Administration-scoped PAT so it could also assert
# bypass_actors. It was withdrawn for two independent reasons:
#
#   1. It was FAIL-OPEN. The endpoint returns 200 while omitting bypass_actors
#      for a caller that may not read it, and `.bypass_actors | length` is 0 for
#      an absent field — so an unreadable value looked like a verified-empty
#      one. A run reported the ruleset healthy seventeen minutes before the PAT
#      existed.
#   2. ADR-0007 (Accepted) forbids secrets in environment variables, which is
#      how a PAT reaches a step. A PAT here was also reachable by PR-controlled
#      code, via both the pull_request trigger and workflow_dispatch's
#      branch selector.
#
# Hence: schedule only — no pull_request, no workflow_dispatch — and the
# repo-scoped GITHUB_TOKEN, which reads the publicly visible fields.
# BYPASS ACTORS ARE NOT COVERED; the script says so on every success. Audit them
# manually at Settings → Rules → main-protection → Bypass list.
#
# PR-time validation of the expectation is unprivileged and lives in ci.yml.

on:
  schedule:
    - cron: "0 7 * * *"  # daily 07:00 UTC

permissions:
  contents: read

jobs:
  ruleset-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Assert the live ruleset against the committed expectation
        env:
          # The repo-scoped GITHUB_TOKEN only. No PAT: ADR-0007 forbids secrets
          # in environment variables, and an Administration-scoped token here
          # was reachable by PR-controlled code.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/check-ruleset-drift.sh
