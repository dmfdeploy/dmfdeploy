<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Step 2: the machine unlocks itself</title>
<desc>A running machine with its lights on has a small square safe door, shut, with a green open padlock on it. The gold round-headed key hangs beside the vault. At the top left, a before and after strip shows a red closed padlock, an arrow labelled starts closed, and a green open padlock labelled opens itself. The admin sits in a chair, relaxed, with a thumb up. The label says Nothing to do. There are no teal keys on the machine.</desc>
