<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" font-family="Helvetica, Arial, sans-serif" fill="#1b1b1b">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="340" fill="#ffffff"/>

  <!-- Boxes -->
  <rect x="30" y="30" width="300" height="100" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
  <rect x="400" y="30" width="300" height="100" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <rect x="770" y="30" width="300" height="100" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
  <rect x="30" y="200" width="300" height="110" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
  <rect x="400" y="200" width="300" height="110" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>

  <!-- Arrows -->
  <line x1="330" y1="80" x2="400" y2="80" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="80" x2="770" y2="80" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 920 130 L 920 160 L 180 160 L 180 198" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="255" x2="400" y2="255" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box text -->
  <text x="180" y="88" font-size="22" text-anchor="middle">Empty machine</text>
  <g text-anchor="middle">
    <text x="550" y="74" font-size="22">Installer (dmf-init)</text>
    <text x="550" y="98" font-size="17">on your computer</text>
  </g>
  <g text-anchor="middle">
    <text x="920" y="66" font-size="22">Install stages</text>
    <text x="920" y="90" font-size="17">(pause for your</text>
    <text x="920" y="110" font-size="17">console passkey)</text>
  </g>
  <g text-anchor="middle">
    <text x="180" y="234" font-size="22">Checkpoint backups</text>
    <text x="180" y="256" font-size="17">(you download them,</text>
    <text x="180" y="274" font-size="17">encrypted with your</text>
    <text x="180" y="292" font-size="17">passphrase)</text>
  </g>
  <g text-anchor="middle" font-size="22">
    <text x="550" y="250">Running cluster</text>
    <text x="550" y="276">with vault</text>
  </g>

  <!-- Arrow labels -->
  <g font-size="18" text-anchor="middle">
    <text x="365" y="72">then</text>
    <text x="735" y="72">then</text>
    <text x="550" y="152">then</text>
    <text x="365" y="247">then</text>
  </g>
</svg>
