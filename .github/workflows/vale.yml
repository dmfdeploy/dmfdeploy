name: vale

# Three layers:
#   1. Whole tree: enforces. "vale ." fails the job on any error-level
#      alert in a linted file. The voice sweep in issue
#      dmfdeploy/dmfdeploy#688 cleared the tree first.
#   2. Clean set: enforces. The files listed in .vale/clean-set.txt have no
#      error-level alerts, so any new error in them fails the job. It names
#      the swept files explicitly, so a scope change can't drop them.
#   3. Changed files: ratchets. On a pull request, no linted Markdown file
#      the PR touches may gain an error-level Voice alert (Contrast, EmDash).
#      It compares counts at the base and the head. See
#      bin/check-voice-changed.sh.
#
# The workflow has no path filter, so the vale check reports on every pull
# request and can be a required check. The scope step lists the paths that
# matter. When a pull request changes none of them, every Vale step is
# skipped and the job passes.
#
# The fixtures step proves the project rules still fire (each bad fixture
# fails under the strict config, each good twin passes). The Voice steps prove
# the Voice rules against their own fixtures and a mutation test.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its parents, for the changed-files step.
          fetch-depth: 2

      - name: Find the changed Vale paths
        id: scope
        run: |
          set -euo pipefail
          # The only list of paths that run the Vale steps on a pull request.
          paths=(
            "README.md"
            "**/README.md"
            "CONTRIBUTING.md"
            "AGENTS.md"
            "ROADMAP.md"
            "docs/decisions/**"
            "docs/design/**"
            "docs/THESIS.md"
            "docs/JOURNEY.md"
            "docs/WORKING-MODEL.md"
            "docs/OPEN-QUESTIONS.md"
            "docs/GLOSSARY.md"
            "docs/INDEX.md"
            "docs/STYLE.md"
            "docs/templates/**"
            ".github/**/*.md"
            "bin/check-voice*.sh"
            "bin/mutate-voice.sh"
            "tests/voice-changed-head.sh"
            "tests/voice-changed-links.sh"
            ".vale.ini"
            ".vale/**"
            ".github/workflows/vale.yml"
          )
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Not a pull request, so every Vale step runs."
            echo "lint=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; its first parent is the base branch.
          changed="$(git diff --name-only HEAD^1 HEAD -- "${paths[@]/#/:(glob)}")"
          if [[ -z "$changed" ]]; then
            echo "No Vale path changed in this pull request. Skipping the Vale steps."
            echo "lint=false" >>"$GITHUB_OUTPUT"
          else
            echo "Vale paths changed in this pull request:"
            printf '%s\n' "$changed"
            echo "lint=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install Vale
        if: steps.scope.outputs.lint == 'true'
        env:
          VALE_VERSION: "3.25.1"
        run: |
          set -euo pipefail
          url="https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          sha="4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182"
          mkdir -p "$RUNNER_TEMP/vale"
          curl -fsSL -o "$RUNNER_TEMP/vale.tgz" "$url"
          echo "$sha  $RUNNER_TEMP/vale.tgz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP/vale" -f "$RUNNER_TEMP/vale.tgz" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Sync the Google package
        if: steps.scope.outputs.lint == 'true'
        run: vale sync

      - name: Lint working surfaces (error level blocks)
        if: steps.scope.outputs.lint == 'true'
        run: vale .

      - name: Enforce Vale on the clean set (error level blocks)
        if: steps.scope.outputs.lint == 'true'
        # The list lives in .vale/clean-set.txt.
        run: |
          set -euo pipefail
          grep -v -e '^#' -e '^[[:space:]]*$' .vale/clean-set.txt \
            | xargs vale --minAlertLevel=error

      - name: Check the README scope
        if: steps.scope.outputs.lint == 'true'
        run: .vale/scope-test.sh

      - name: Check the fixtures (strict config)
        if: steps.scope.outputs.lint == 'true'
        run: |
          set -euo pipefail
          for bad in .vale/fixtures/bad-*.md; do
            good="${bad/bad-/good-}"
            if vale --config .vale/strict.ini "$bad" >/dev/null; then
              echo "::error::$bad passed but must fail"; exit 1
            fi
            vale --config .vale/strict.ini "$good" >/dev/null \
              || { echo "::error::$good must pass"; exit 1; }
          done

      - name: Check the Voice fixtures
        if: steps.scope.outputs.lint == 'true'
        run: bin/check-voice-fixtures.sh

      - name: Mutation-test the Voice rules
        if: steps.scope.outputs.lint == 'true'
        run: bin/mutate-voice.sh

      - name: Ratchet the Voice errors in changed files
        if: github.event_name == 'pull_request' && steps.scope.outputs.lint == 'true'
        # HEAD is the PR merge commit; its first parent is the base branch.
        run: bin/check-voice-changed.sh HEAD^1 HEAD

      - name: Test that the ratchet reads HEAD, not the checkout
        if: steps.scope.outputs.lint == 'true'
        run: tests/voice-changed-head.sh

      - name: Test that the ratchet counts encoded link targets the same way
        if: steps.scope.outputs.lint == 'true'
        run: tests/voice-changed-links.sh
