name: vale

# WARN mode for the whole tree: findings are reported, the job passes. The
# fixtures step proves the project rules still fire (each bad fixture fails
# under the strict config, each good twin passes). The Voice steps prove the
# Voice rules against their own fixtures and a mutation test.
#
# One strict step: on a pull request, no linted Markdown file the PR touches
# may gain an error-level Voice alert (Contrast, EmDash). It compares counts
# at the base and the head, so it blocks new occurrences without a cleanup of
# the whole corpus first. See bin/check-voice-changed.sh.

on:
  pull_request:
    paths:
      - "README.md"
      - "**/README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "ROADMAP.md"
      - "docs/decisions/**"
      - "docs/design/**"
      - "docs/THESIS.md"
      - "docs/JOURNEY.md"
      - "docs/WORKING-MODEL.md"
      - "docs/OPEN-QUESTIONS.md"
      - "docs/GLOSSARY.md"
      - "docs/INDEX.md"
      - "docs/STYLE.md"
      - "docs/templates/**"
      - ".github/**/*.md"
      - "bin/check-voice*.sh"
      - "bin/mutate-voice.sh"
      - "tests/voice-changed-head.sh"
      - "tests/voice-changed-links.sh"
      - ".vale.ini"
      - ".vale/**"
      - ".github/workflows/vale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vale:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          # The PR merge commit and its parents, for the changed-files step.
          fetch-depth: 2

      - name: Install Vale
        env:
          VALE_VERSION: "3.24.0"
        run: |
          set -euo pipefail
          url="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          sha="867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214"
          mkdir -p "$RUNNER_TEMP/vale"
          curl -fsSL -o "$RUNNER_TEMP/vale.tgz" "$url"
          echo "$sha  $RUNNER_TEMP/vale.tgz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP/vale" -f "$RUNNER_TEMP/vale.tgz" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Sync the Google package
        run: vale sync

      - name: Lint working surfaces (warn mode)
        run: vale --no-exit .

      - name: Check the README scope
        run: .vale/scope-test.sh

      - name: Check the fixtures (strict config)
        run: |
          set -euo pipefail
          for bad in .vale/fixtures/bad-*.md; do
            good="${bad/bad-/good-}"
            if vale --config .vale/strict.ini "$bad" >/dev/null; then
              echo "::error::$bad passed but must fail"; exit 1
            fi
            vale --config .vale/strict.ini "$good" >/dev/null \
              || { echo "::error::$good must pass"; exit 1; }
          done

      - name: Check the Voice fixtures
        run: bin/check-voice-fixtures.sh

      - name: Mutation-test the Voice rules
        run: bin/mutate-voice.sh

      - name: Ratchet the Voice errors in changed files
        if: github.event_name == 'pull_request'
        # HEAD is the PR merge commit; its first parent is the base branch.
        run: bin/check-voice-changed.sh HEAD^1 HEAD

      - name: Test that the ratchet reads HEAD, not the checkout
        run: tests/voice-changed-head.sh

      - name: Test that the ratchet counts encoded link targets the same way
        run: tests/voice-changed-links.sh
