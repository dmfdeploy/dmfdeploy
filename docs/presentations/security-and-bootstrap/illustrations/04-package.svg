<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Step 4: the admin keeps the recovery package</title>
<desc>The admin puts a cream envelope with a small gold key on it, the recovery package, into a small safe whose door stands open and shows a dial and a handle. The label says You keep it. In the background, faded, the machine stands with its a green open padlock on its safe door and two padlocked copies on its left side.</desc>
