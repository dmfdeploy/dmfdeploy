<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="376" viewBox="0 0 1100 376" font-family="Helvetica, Arial, sans-serif" fill="#1b1b1b">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="376" fill="#ffffff"/>

  <!-- Row 1: confirm, check, root token -->
  <polygon points="30,30 330,30 310,120 50,120" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
  <rect x="400" y="30" width="300" height="90" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
  <rect x="770" y="30" width="300" height="90" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>

  <!-- Row 2: mint and revoke, change, revoke -->
  <rect x="30" y="180" width="300" height="90" rx="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
  <rect x="400" y="180" width="300" height="90" rx="10" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="2"/>
  <rect x="770" y="180" width="300" height="90" rx="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>

  <!-- Footer: audit -->
  <rect x="330" y="300" width="440" height="46" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>

  <!-- Arrows -->
  <line x1="322" y1="75" x2="400" y2="75" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="75" x2="770" y2="75" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 920 120 L 920 150 L 180 150 L 180 178" fill="none" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="225" x2="400" y2="225" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="225" x2="770" y2="225" stroke="#1b1b1b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box text: row 1 -->
  <g font-size="22" text-anchor="middle">
    <text x="180" y="70">You confirm</text>
    <text x="180" y="96">on a device</text>
    <text x="550" y="57">Executor checks</text>
    <text x="550" y="83">the policy and</text>
    <text x="550" y="109">the request</text>
    <text x="920" y="69">Root token</text>
  </g>
  <text x="920" y="93" font-size="17" text-anchor="middle">(executor only)</text>

  <!-- Box text: row 2 -->
  <g font-size="22" text-anchor="middle">
    <text x="180" y="220">Narrow token minted,</text>
    <text x="180" y="246">root token revoked</text>
    <text x="550" y="233">Change runs</text>
    <text x="920" y="233">Narrow token revoked</text>
  </g>

  <!-- Footer text -->
  <text x="550" y="331" font-size="22" text-anchor="middle">Audit names you at each step</text>

  <!-- Arrow labels -->
  <g font-size="18" text-anchor="middle">
    <text x="361" y="67">then</text>
    <text x="735" y="67">then</text>
    <text x="550" y="142">then</text>
    <text x="365" y="217">then</text>
    <text x="735" y="217">then</text>
  </g>
</svg>
