name: surface

# Surface checks (#617): size budgets, filenames, archive placement, the
# status log and ADR Enforcement (#661). The fixture run must pass, and each
# subcommand runs in strict mode as its own step, so a finding fails the job
# and names its check. Enforcement became strict once #702 cleaned the ADRs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fixture tests
        run: tests/surface/run.sh
      - name: Size budgets
        run: bin/check-surface.sh --strict size
      - name: Filenames
        run: bin/check-surface.sh --strict filenames
      - name: Archive placement
        run: bin/check-surface.sh --strict placement
      - name: Status log
        run: bin/check-surface.sh --strict statuslog
      - name: ADR enforcement
        run: bin/check-surface.sh --strict enforcement
