name: Bug report
description: Something is broken or behaving unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Never paste secrets, real IPs/DNS, kubeconfigs, or operator identity.**
        Use placeholders (`<control-node-public-ip>`, `dmf.example.com`, `<handle>`).
        For security vulnerabilities, **stop** — use SECURITY.md (private reporting).
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: The matching `component:*` label is applied when the issue is triaged. Use `umbrella` for docs and process, `cross-repo` when the work spans repos.
      options:
        - dmf-cms
        - dmf-infra
        - dmf-env
        - dmf-central
        - dmf-media
        - dmf-runbooks
        - dmf-init
        - dmf-promsd
        - umbrella
        - cross-repo
    validations: { required: true }
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: The matching `workstream:*` label is applied when the issue is triaged. See docs/WORKING-MODEL.md section 2.
      options:
        - release
        - compliance
        - monitoring
        - infra-debt
        - scaffold
        - hygiene
        - ADR
        - catalog
        - identity-secrets
        - hardening
        - entrance
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Contents of the repo's VERSION file (or commit SHA).
    validations: { required: true }
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected vs. what occurred. Redact any sensitive values.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How to check that this is done. Write one checkable item per line, starting with `- `. An issue in a milestone needs at least one item (docs/WORKING-MODEL.md section 7).
      value: "- "
    validations: { required: false }
