# Vale configuration for the dmfdeploy working surfaces.
#
# The Google package is not committed. CI runs `vale sync` to fetch it into
# .vale/styles/Google. Project rules live in .vale/styles/Dmfdeploy.
#
# Scope: only the sections below are linted. A file without a matching
# section is skipped. docs/archive/ is exempt from Vale (and only from
# Vale: secret scanning and the scrub script still cover it): its section
# comes after [**/README.md] and clears the styles, so the archive README
# is skipped too. The root README needs its own section, because
# **/README.md matches only README files inside a directory.
# .vale/scope-test.sh checks this layout.
#
# WARN mode: CI runs `vale --no-exit`. For a strict run on the fixtures, use
# .vale/strict.ini (see .vale/fixtures/README.md).

StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Dmfdeploy
Packages = Google

[README.md]
BasedOnStyles = Google, Dmfdeploy

[**/README.md]
BasedOnStyles = Google, Dmfdeploy

[CONTRIBUTING.md]
BasedOnStyles = Google, Dmfdeploy

[AGENTS.md]
BasedOnStyles = Google, Dmfdeploy

[ROADMAP.md]
BasedOnStyles = Google, Dmfdeploy

[docs/decisions/**/*.md]
BasedOnStyles = Google, Dmfdeploy

[docs/design/**/*.md]
BasedOnStyles = Google, Dmfdeploy

[docs/archive/**]
BasedOnStyles =
