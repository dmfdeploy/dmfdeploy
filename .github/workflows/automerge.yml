name: automerge
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled, edited]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
jobs:
  automerge:
    # Metadata-only — no checkout, never executes PR code, and under
    # pull_request_target the BASE branch's workflow definition runs, so a PR
    # cannot alter this job to its own advantage. It only arms GitHub-native
    # rebase auto-merge: the actual merge happens when (and only when) the
    # branch ruleset is satisfied — CODEOWNERS approval + every required
    # status check green. Working-model mechanism: dmfdeploy/dmfdeploy#34.
    # That ruleset covers only the default branch, so only PRs into it arm.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Arm rebase auto-merge (hold label disarms)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          set -eu
          # `edited` is here only to catch a base change. A title or body edit
          # leaves the PR as it was.
          if [ "${EVENT_ACTION}" = "edited" ] && [ "${BASE_CHANGED}" != "true" ]; then
            echo "edit did not change the base — nothing to do"
            exit 0
          fi
          # Decide from the PR's labels and draft state as they are now, not
          # from the event payload, which is a snapshot: `gh pr create --label`
          # fires `opened` without the label, and a late `opened` run would
          # arm a held PR (#439). If the read fails, exit non-zero without
          # touching auto-merge, so a failed read never arms. The same holds
          # for a reply that is not a boolean isDraft, named labels and a
          # non-empty base branch name.
          pr=$(gh pr view "${PR_URL}" --json labels,isDraft,baseRefName)
          jq -e '(.isDraft | type == "boolean") and (.labels | type == "array")
            and all(.labels[]; (.name | type) == "string")
            and (.baseRefName | type == "string" and length > 0)' <<<"${pr}" >/dev/null
          labels=$(jq -r '[.labels[].name] | join(" ")' <<<"${pr}")
          draft=$(jq -r '.isDraft' <<<"${pr}")
          base=$(jq -r '.baseRefName' <<<"${pr}")
          # Only the default branch carries the ruleset that requires an
          # approving review and blocks merges while changes are requested.
          # Any other live base is ungated, so every non-default live base
          # takes the hold path: it adds `hold` and disarms. This also
          # migrates a PR armed by an earlier run while its base was still
          # the default branch — once retargeted, it is disarmed here rather
          # than left armed on an unprotected base. If the label write fails,
          # still disarm, then fail the run so the missing label shows.
          label_rc=0
          add_hold() {
            case " ${labels} " in *" hold "*) return 0 ;; esac
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
              -f "labels[]=hold" >/dev/null || label_rc=$?
          }
          hold_path() {
            gh pr merge --disable-auto "${PR_URL}" || true
            echo "hold label present — auto-merge disarmed"
            if [ "${label_rc}" != 0 ]; then
              echo "::error::could not add the hold label on '${base}'"
              exit 1
            fi
            exit 0
          }
          if [ -n "${DEFAULT_BRANCH}" ] && [ "${base}" != "${DEFAULT_BRANCH}" ]; then
            add_hold
            hold_path
          fi
          case " ${labels} " in *" hold "*) add_hold; hold_path ;; esac
          if [ "${draft}" = "true" ]; then
            echo "draft PR — skipping"
            exit 0
          fi
          # Only the default branch has a ruleset that requires an approving
          # review and blocks on changes requested. Armed auto-merge into any
          # other branch would merge with no review at all, so those PRs are
          # merged by hand.
          if [ -z "${DEFAULT_BRANCH}" ]; then
            echo "default branch unknown — not arming; merge by hand"
            exit 0
          fi
          gh pr merge --auto --rebase "${PR_URL}"
          # A retarget between the read above and the arm can leave this PR
          # armed on an unprotected base, and the edited run that would hold it
          # may be waiting behind this one. Re-read the base; if it moved, hold.
          # A failed re-read counts as a moved base, so it holds too; the
          # runner's pipefail would otherwise end the job before the hold.
          base=$(gh pr view "${PR_URL}" --json baseRefName | jq -r '.baseRefName // ""') || base=
          if [ "${base}" != "${DEFAULT_BRANCH}" ]; then
            echo "base is now '${base}', not '${DEFAULT_BRANCH}' — applying hold"
            add_hold
            hold_path
          fi
          echo "auto-merge (rebase) armed — merges when approval + required checks are satisfied"
