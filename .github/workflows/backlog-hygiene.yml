name: backlog-hygiene

on:
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Offline check that the freshness rules still detect what they claim to.
      # A failure here means the checker is broken, not that the backlog is.
      - name: Self-test the freshness rules
        run: bin/check-backlog-hygiene.sh --self-test

      # Warn mode: the checker runs with --warn, so it prints findings and
      # exits 0. Because the exit code no longer signals findings, the step
      # reads the count from the checker's last line ("backlog-hygiene: N
      # finding(s) ...") and records has_findings. A crash (non-zero exit, or
      # no summary line) also counts as a finding, so it is still reported.
      - name: Run backlog-hygiene check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: hygiene_run
        run: |
          # pipefail so rc reflects the checker, not tee
          set +e
          set -o pipefail
          bin/check-backlog-hygiene.sh --warn 2>&1 | tee /tmp/report.txt
          rc=$?
          set -e
          count="$(sed -n 's/^backlog-hygiene: \([0-9][0-9]*\) finding.*/\1/p' /tmp/report.txt | tail -1)"
          if [ "$rc" -ne 0 ]; then
            has=true
          elif [ -n "$count" ] && [ "$count" -gt 0 ]; then
            has=true
          elif grep -q '^backlog-hygiene: OK' /tmp/report.txt; then
            has=false
          else
            has=true
          fi
          echo "has_findings=$has" >> "$GITHUB_OUTPUT"

      - name: Manage report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_FINDINGS: ${{ steps.hygiene_run.outputs.has_findings }}
        run: |
          set -euo pipefail

          # The report issue carries hygiene-exempt so the checker never
          # flags its own report (no milestone/workstream by design).
          existing="$(gh issue list \
            --repo dmfdeploy/dmfdeploy \
            --search "Backlog hygiene report in:title" \
            --state open \
            --label component:cross-repo \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          {
            printf '## Backlog hygiene report — %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '```\n'
            cat /tmp/report.txt
            printf '```\n'
          } > /tmp/body.md

          if [ "${HAS_FINDINGS:-true}" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" \
                --repo dmfdeploy/dmfdeploy \
                --body-file /tmp/body.md
              echo "Updated report issue #$existing"
            else
              gh issue create \
                --repo dmfdeploy/dmfdeploy \
                --title "Backlog hygiene report" \
                --label component:cross-repo \
                --label hygiene-exempt \
                --body-file /tmp/body.md
              echo "Created report issue"
            fi
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --repo dmfdeploy/dmfdeploy \
                --comment "Clean run — no findings." \
                --reason completed
              echo "Closed report issue #$existing (clean run)"
            else
              echo "No findings, no open report issue — nothing to do"
            fi
          fi
