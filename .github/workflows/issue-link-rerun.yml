name: issue-link-rerun

# This workflow only observes a successful first attempt of the trusted
# issue-link workflow. Its code runs from main and never checks out PR code.
on:
  workflow_run:
    workflows: [issue-link]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: issue-link-rerun-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Re-run eligible failed issue-link suites
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python3 bin/lib/rerun_issue_link.py
