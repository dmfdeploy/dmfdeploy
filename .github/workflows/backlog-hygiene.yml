name: backlog-hygiene

on:
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Offline check that the freshness rules still detect what they claim to.
      # A failure here means the checker is broken, not that the backlog is.
      - name: Self-test the freshness rules
        run: bin/check-backlog-hygiene.sh --self-test

      # Strict mode: the checker exits 1 on findings. The step captures the
      # exit code instead of failing, so the report issue is still updated or
      # closed; the last step fails the job. has_findings is false only when
      # the checker exits 0 AND its last line is exactly the OK line. An
      # INCOMPLETE line (a check could not read its input), a crash or a
      # missing summary line all set it to true.
      - name: Run backlog-hygiene check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: hygiene_run
        run: |
          # pipefail so rc reflects the checker, not tee
          set +e
          set -o pipefail
          bin/check-backlog-hygiene.sh 2>&1 | tee /tmp/report.txt
          rc=$?
          set -e
          last="$(grep -v '^[[:space:]]*$' /tmp/report.txt | tail -1 || true)"
          if [ "$rc" -eq 0 ] && [ "$last" = "backlog-hygiene: OK (0 findings)" ]; then
            has=false
          else
            has=true
          fi
          echo "has_findings=$has" >> "$GITHUB_OUTPUT"

      - name: Manage report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_FINDINGS: ${{ steps.hygiene_run.outputs.has_findings }}
        run: |
          set -euo pipefail

          # The report issue carries hygiene-exempt so the checker never
          # flags its own report (no milestone/workstream by design).
          existing="$(gh issue list \
            --repo dmfdeploy/dmfdeploy \
            --search "Backlog hygiene report in:title" \
            --state open \
            --label component:cross-repo \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          # An incomplete or crashed run keeps the issue open and says so,
          # because its findings list may be missing checks.
          last="$(grep -v '^[[:space:]]*$' /tmp/report.txt | tail -1 || true)"
          {
            printf '## Backlog hygiene report — %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            case "$last" in
              "backlog-hygiene: INCOMPLETE"*)
                printf '**The run was incomplete:** at least one check could not read its input (see SKIPPED below), so findings may be missing.\n\n' ;;
              "backlog-hygiene: "*) ;;
              *)
                printf '**The run did not finish:** the checker printed no summary line.\n\n' ;;
            esac
            printf '```\n'
            cat /tmp/report.txt
            printf '```\n'
          } > /tmp/body.md

          if [ "${HAS_FINDINGS:-true}" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" \
                --repo dmfdeploy/dmfdeploy \
                --body-file /tmp/body.md
              echo "Updated report issue #$existing"
            else
              gh issue create \
                --repo dmfdeploy/dmfdeploy \
                --title "Backlog hygiene report" \
                --label component:cross-repo \
                --label hygiene-exempt \
                --body-file /tmp/body.md
              echo "Created report issue"
            fi
          else
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --repo dmfdeploy/dmfdeploy \
                --comment "Clean run — no findings." \
                --reason completed
              echo "Closed report issue #$existing (clean run)"
            else
              echo "No findings, no open report issue — nothing to do"
            fi
          fi

      # Fails the job when the check found drift or crashed, after the report
      # issue is handled. Runs even if an earlier step failed.
      - name: Fail on findings
        if: always()
        env:
          HAS_FINDINGS: ${{ steps.hygiene_run.outputs.has_findings }}
        run: |
          if [ "${HAS_FINDINGS:-}" != "false" ]; then
            echo "::error::backlog-hygiene found drift or did not finish; see the report issue"
            exit 1
          fi
