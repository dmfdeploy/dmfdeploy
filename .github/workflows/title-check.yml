name: title-check

# Two jobs. "title" rejects titles that start with a bracketed "[auto]"
# prefix. It is in strict mode: STRICT is 1 (see the env block), so a bad
# title fails the job. Set STRICT to 0 to go back to a warning annotation
# that passes.
#
# "static" runs on pull requests only. It checks the issue forms, CODEOWNERS
# and the PR template, then runs the same checker on the fixtures in
# .github/title-check-fixtures/ and asserts that each bad one fails and each
# good one passes. All logic lives in .github/scripts/hygiene-check.sh, so
# the same code runs locally.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check the title
        env:
          STRICT: "1"
        run: .github/scripts/hygiene-check.sh title

  static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check the real files
        run: .github/scripts/hygiene-check.sh real
      - name: Check the fixtures
        run: .github/scripts/hygiene-check.sh fixtures
