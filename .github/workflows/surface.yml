name: surface

# Surface checks (#617): size budgets, filenames, archive placement, the
# status log and ADR Enforcement (#661). The fixture run must pass, and each
# subcommand runs in strict mode, so a finding fails the job and names its
# check. The commands live in the surface step of bin/check.sh, and
# tests/hygiene-modes.sh pins them there. Enforcement became strict once #702
# cleaned the ADRs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the surface step
        run: bin/check.sh surface
