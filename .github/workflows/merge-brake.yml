name: merge-brake

# Fails while a pull request to main carries the "hold" label (umbrella
# #439). Made a required check on main, it blocks the merge: the check fails
# on every label, push and edit event while "hold" is present, and no merge
# can land once that run is registered. Auto-merge can stay armed; it can't
# fire while this check is red.
#
# Residual window: GitHub dispatches this run after the label event, and the
# earlier green result can still count until then. A PR that is already armed,
# has every required check green and waits only on approval can still merge
# if the approval lands in that short interval. automerge.yml has the same
# lag. To leave no window, open the PR with the label (gh pr create --label
# hold): the opened event then carries "hold", automerge.yml never arms, and
# this check starts red.
#
# Why pull_request_target: it runs this workflow file and the brake script
# from the base branch, never from the PR. Under pull_request a PR could
# rewrite this file and report a green check with the same name.
#
# Why hold only: review state needs pull_request_review, which always runs
# the PR's copy of the workflow, so it can't be trusted here. On main the
# ruleset already refuses a merge while a reviewer has an outstanding request
# for changes.
#
# Safety under pull_request_target: no PR code is checked out or run. The only
# checkout is the base commit, sparse to the brake script. The token can read
# the repository and pull requests and nothing else, and no secrets are used.
# Label names reach the script only as JSON on stdin, never through the shell.
#
# Each run reads the labels from the API at run time rather than from the
# event payload, so the latest run reflects the current state. All decision
# logic lives in .github/scripts/merge-brake.sh, which tests/merge-brake.sh
# covers without GitHub.

on:
  pull_request_target:
    branches: [main]
    # "edited" gives a PR retargeted onto main its first brake run.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions: {}

concurrency:
  group: merge-brake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-brake:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read  # actions/checkout of the base commit
      pull-requests: read
    steps:
      - name: Check out the brake script from the base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the hold label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          brake=base/.github/scripts/merge-brake.sh
          echo "base commit: ${BASE_SHA}"
          if [ ! -f "$brake" ]; then
            echo "::error title=merge-brake::the base commit has no .github/scripts/merge-brake.sh, so the brake fails closed"
            exit 1
          fi
          echo "brake script sha256: $(sha256sum "$brake" | cut -d' ' -f1)"
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '{labels: [.labels[].name]}' \
            | bash "$brake"
