# Vale configuration for the dmfdeploy working surfaces.
#
# The Google package is not committed. CI runs `vale sync` to fetch it into
# .vale/styles/Google. Project rules live in .vale/styles/Dmfdeploy, and
# the rules for generated-sounding prose in .vale/styles/Voice (docs/STYLE.md).
#
# Scope: only the sections below are linted. A file without a matching
# section is skipped. docs/archive/ is exempt from Vale (and only from
# Vale: secret scanning and the scrub script still cover it): its section
# comes after [**/README.md] and clears the styles, so the archive README
# is skipped too. The root README needs its own section, because
# **/README.md matches only README files inside a directory.
# .vale/scope-test.sh checks this layout.
#
# Three layers in CI: the whole tree enforces (`vale .`), the files in
# .vale/clean-set.txt enforce (an error-level alert fails the job), and
# changed files ratchet. For a strict run on the fixtures, use
# .vale/strict.ini (see .vale/fixtures/README.md).
# On a pull request, bin/check-voice-changed.sh fails when a file the PR
# touches gains an error-level Voice alert, with a config derived from this file.

StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Dmfdeploy
Packages = Google

[README.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[**/README.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[CONTRIBUTING.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[AGENTS.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[ROADMAP.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/decisions/**/*.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/design/**/*.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/THESIS.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/JOURNEY.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/WORKING-MODEL.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/OPEN-QUESTIONS.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/GLOSSARY.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/INDEX.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/STYLE.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/templates/**/*.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[.github/**/*.md]
BasedOnStyles = Google, Dmfdeploy, Voice

[docs/archive/**]
BasedOnStyles =
