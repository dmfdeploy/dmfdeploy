name: governance-drift

# Asserts the live branch ruleset against .github/expected-ruleset.json.
#
# The ruleset is what makes every other gate binding — required checks,
# code-owner review, linear history, zero bypass actors. Nothing asserted it,
# so a dropped required check or an added bypass actor would go unnoticed
# (umbrella issue #368). Anti-degradation belongs in a deterministic assertion
# rather than in a role: a check cannot forget.
#
# TOKEN: reading a ruleset needs repository ADMINISTRATION READ, which the
# default GITHUB_TOKEN does not carry. Supply a fine-grained PAT with that
# permission as the repo secret RULESET_READ_TOKEN. Without it the step exits 2
# (could not run) and the job FAILS — it never reports clean when it could not
# actually look.
#
# NO pull_request TRIGGER, DELIBERATELY. This workflow hands a privileged PAT to
# bin/check-ruleset-drift.sh, which lives in the repo and is therefore
# PR-controlled. On a pull_request event a same-repository PR receives secrets,
# so a PR editing that script — or this file — could exfiltrate the token;
# persist-credentials: false does nothing about an environment secret. An
# earlier revision made that worse by listing the script in a paths filter, so
# the malicious edit was exactly what triggered the privileged run.
#
# The privileged read therefore runs ONLY from trusted refs: schedule (always
# the default branch) and manual dispatch. The trust boundary is code review.
# PR-time validation of the expectation file is unprivileged and lives in
# ci.yml, where no secret is in scope. Gating with an `if:` was rejected — one
# typo re-exposes the token, whereas an absent trigger cannot.

on:
  schedule:
    - cron: "0 7 * * *"  # daily 07:00 UTC

permissions:
  contents: read

jobs:
  ruleset-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Assert the live ruleset against the committed expectation
        env:
          # The repo-scoped GITHUB_TOKEN only. No PAT: ADR-0007 forbids secrets
          # in environment variables, and an Administration-scoped token here
          # was reachable by PR-controlled code.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/check-ruleset-drift.sh
